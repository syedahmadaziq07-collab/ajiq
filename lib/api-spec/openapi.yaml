openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: blog-posts
    description: Blog post operations
  - name: newsletter
    description: Newsletter subscription
  - name: contact
    description: Contact form
  - name: wallpapers
    description: Wallpaper listing
  - name: templates
    description: Template listing
  - name: guides
    description: Guide listing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /blog-posts:
    get:
      operationId: listBlogPosts
      tags: [blog-posts]
      summary: List all blog posts
      responses:
        "200":
          description: A list of blog posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"
  /blog-posts/{slug}:
    get:
      operationId: getBlogPost
      tags: [blog-posts]
      summary: Get a single blog post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Not found

  /newsletter:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe to newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterInput"
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Submit a contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /wallpapers:
    get:
      operationId: listWallpapers
      tags: [wallpapers]
      summary: List all wallpapers
      responses:
        "200":
          description: A list of wallpapers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wallpaper"

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List all templates
      responses:
        "200":
          description: A list of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"

  /guides:
    get:
      operationId: listGuides
      tags: [guides]
      summary: List all guides
      responses:
        "200":
          description: A list of guides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guide"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    BlogPost:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        content:
          type: string
        imageUrl:
          type: string
        author:
          type: string
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - slug
        - excerpt
        - content
        - imageUrl
        - author
        - publishedAt

    NewsletterInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    ContactInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        subject:
          type: string
        message:
          type: string
      required:
        - name
        - email
        - subject
        - message

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    Wallpaper:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        category:
          type: string
        imageUrl:
          type: string
        downloadUrl:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - slug
        - category
        - imageUrl
        - downloadUrl

    Template:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        category:
          type: string
        imageUrl:
          type: string
        downloadUrl:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - slug
        - category
        - imageUrl
        - downloadUrl

    Guide:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - slug
        - description
        - imageUrl
        - content

